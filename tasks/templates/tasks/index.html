{% load static %}

<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mes tâches</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f6f7f9;
            color: #222;
        }


        main {
            width: 90%;
            max-width: 650px;

            margin: 70px auto;
        }


        header {
            margin-bottom: 30px;
        }


        h1 {
            margin: 0 0 8px;

            font-size: 32px;
            font-weight: 600;
        }


        .subtitle {
            margin: 0;
            color: #777;
            font-size: 15px;
        }


        .card {
            background: white;

            padding: 24px;

            border: 1px solid #e8e8e8;
            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.04);
        }


        form {
            display: flex;
            gap: 10px;

            margin-bottom: 25px;
        }


        #task-title {
            flex: 1;

            border: 1px solid #d8d8d8;
            border-radius: 7px;

            padding: 11px 13px;

            font-size: 15px;

            outline: none;
        }


        #task-title:focus {
            border-color: #777;
        }


        .add-button {
            border: none;
            border-radius: 7px;

            background: #222;
            color: white;

            padding: 0 18px;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;
        }


        .add-button:hover {
            background: #444;
        }


        ul {
            list-style: none;

            margin: 0;
            padding: 0;
        }


        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            padding: 15px 5px;

            border-bottom: 1px solid #eeeeee;
        }


        .task:last-child {
            border-bottom: none;
        }


        .task-content {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .task-content input {
            width: 17px;
            height: 17px;

            cursor: pointer;
        }


        .task-title {
            font-size: 15px;

            word-break: break-word;
        }


        .completed .task-title {
            text-decoration: line-through;
            color: #999;
        }


        .actions {
            display: flex;
            gap: 6px;
        }


        .actions button {
            border: 1px solid #ddd;

            background: white;

            border-radius: 6px;

            padding: 7px 10px;

            cursor: pointer;

            font-size: 12px;
        }


        .edit-button:hover {
            background: #f2f2f2;
        }


        .delete-button {
            color: #c63e3e;
        }


        .delete-button:hover {
            background: #fff2f2;
        }


        .empty {
            padding: 25px 0;

            text-align: center;

            color: #999;
            font-size: 14px;
        }


        @media (max-width: 550px) {

            main {
                margin: 30px auto;
            }

            form {
                flex-direction: column;
            }

            .add-button {
                padding: 11px;
            }

            .task {
                align-items: flex-start;
            }

            .actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <main>

        <header>

            <h1>Mes tâches</h1>

            <p class="subtitle">
                                Liste de tâches utilisant Django pour le back et TypeScript pour le front.
            </p>

        </header>


        <section class="card">

            <form id="task-form">

                <input
                    id="task-title"
                    type="text"
                    maxlength="200"
                    placeholder="Ajouter une nouvelle tâche..."
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    class="add-button"
                >
                    Ajouter
                </button>

            </form>


            <ul id="task-list"></ul>

        </section>

        <footer>
            <p class="subtitle">
            Developpement d'une application web avec Django et Typescript réalisée par Nour Hannachi
            </p>
        </footer>

    </main>


    <script
        type="module"
        src="{% static 'tasks/app.js' %}"
    ></script>

</body>

</html>
